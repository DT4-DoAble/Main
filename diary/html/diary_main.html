    <script type="module" src="../js/diaryList.js" defer></script>

      <div class="center-align-wrapper header-wrapper">

          <h2 class="calendarTitle page-title text-l-b">일기</h2>
          <button
            id="openModal"
            class="button btn-add-schedule text-s-b bs-t-f bs-c-m bs-s-base-ti"
            type="button"
          >
            추가
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
            >
              <path
                d="M9 3.75V14.25M3.75 9H14.25"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </header>
      </div>

      <!-- Main -->
      <div class="center-align-wrapper main-wrapper">
        <!-- 모달 오버레이 -->
        <div class="modal-overlay bg-blur"></div>
        <!-- 모달 -->
        <div class="modal">
          <!-- S : 모달 내부 내용 -->
          <div class="title">
            <h3>하루 저장하기</h3>
            <div class="btn-close close">
              <img class="img-close" src="../img/X.svg" />
            </div>
          </div>
          <!--main-->

          <!--divFeeling-->
          <div class="contents-area">
            <div class="divDays">
              <div>
                <span class="ftMon" id="today-month"></span>
                <span class="mon">월</span>
                <!-- 월 표시할 곳 -->
              </div>
              <div>
                <span class="ftDay" id="today-day"></span>
                <span class="day">일</span>
              </div>
            </div>

            <div class="box-contents-wrapper">
              <div class="box-wrapper">
                <h4 class="semiTitle">내가 느낀 감정을 선택해 본다면?</h4>
                <div class="divFeeling">
                  <!--divEmoji-->
                  <div class="divEmoji">
                    <img
                      class="emoji smile"
                      src="../img/smile.svg"
                      data-value="smile"
                      data-default="../img/smile.svg"
                      data-selected="../img/smileSt.svg"
                    />
                    <img
                      class="emoji normal"
                      src="../img/normal.svg"
                      data-value="normal"
                      data-default="../img/normal.svg"
                      data-selected="../img/normalSt.svg"
                    />
                    <img
                      class="emoji anger"
                      src="../img/anger.svg"
                      data-value="anger"
                      data-default="../img/anger.svg"
                      data-selected="../img/angerSt.svg"
                    />
                    <img
                      class="emoji sad"
                      src="../img/sad.svg"
                      data-value="sad"
                      data-default="../img/sad.svg"
                      data-selected="../img/sadSt.svg"
                    />
                  </div>
                  <!--//divEmoji-->
                  <div class="emotions"></div>
                </div>
                <!--//divFeeling-->
              </div>
              <div class="box-wrapper">
                <h4 class="semiTitle">오늘 하루를 표현한다면?</h4>
                <input
                  type="text"
                  class="txtDiary"
                  placeholder="당신의 오늘 하루는 어땠나요?"
                />
              </div>
            </div>
          </div>
          <button class="btnSave" value="submit">하루 저장하기</button>
        </div>
        <!-- 메인 컨텐츠 -->
        <main class="main diary-main-area">
          <div class="diary-header">
            <h2 class="page-title">
              <span class="ftMon" id="main-today-month"></span>
              <span class="mon">월</span>
            </h2>
            <div class="calendarControls date-controller">
              <button type="button" class="calendarPrev button-prev-month">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="22"
                  height="22"
                  viewBox="0 0 22 22"
                  fill="none"
                >
                  <path
                    d="M13.75 16.5L8.25 11L13.75 5.5"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <span class="divide-bar vt-1"></span>
              <button
                type="button"
                class="calendarThisMonth button-label text-s-b"
              >
                이번달
              </button>
              <span class="divide-bar vt-1"></span>
              <button type="button" class="calendarNext button-next-month">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="22"
                  height="22"
                  viewBox="0 0 22 22"
                  fill="none"
                >
                  <path
                    d="M8.25 16.5L13.75 11L8.25 5.5"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
            <div class="main-header-button-wrapper">
              <button
                id="openModalWeb"
                class="button btn-add-schedule text-s-b bs-t-f bs-c-m bs-s-base-ti"
                type="button"
              >
                추가
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 18 18"
                  fill="none"
                >
                  <path
                    d="M9 3.75V14.25M3.75 9H14.25"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div id="diaryList" class="diary-item-list-area"></div>
        </main>
